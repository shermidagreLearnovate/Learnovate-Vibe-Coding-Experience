services:
  db:
    image: postgres:15-alpine
    container_name: task-mgmt-db
    restart: always
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: task_db
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d task_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: task-mgmt-backend
    environment:
      DATABASE_URL: "postgresql://user:password@db:5432/task_db?schema=public"
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: task-mgmt-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
